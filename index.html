<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sailkiki 的研究项目主页。">
  <title>Sailkiki｜研究项目</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page-width">
  <header class="site-header">
    <p class="eyebrow">研究项目主页</p>
    <h1>Sailkiki</h1>
    <p class="intro">围绕驾驶场景三维重建、视点外推、动态目标编辑与场景渲染的实验结果展示。</p>
  </header>

  <section class="projects" aria-labelledby="projects-title">
    <h2 id="projects-title">项目</h2>
    <div class="project-list">
      <article class="project-card">
        <p class="project-index">项目 1</p>
        <h3><span class="latin">GECO-GS</span></h3>
        <p>面向驾驶场景新视角外推的几何约束动态三维高斯场景。页面包含定量表格、消融结果及图 4–8。</p>
        <p class="project-meta">数据来源：<span class="latin">Waymo Open Dataset</span> 真实街景序列</p>
        <a href="projects/geco-gs/">查看项目主页 <span aria-hidden="true">→</span></a>
      </article>

      <article class="project-card">
        <p class="project-index">项目 2</p>
        <h3><span class="latin">omnire-carla-gs</span></h3>
        <p>基于公共数据集真实街景的动态目标轨迹编辑、<span class="latin">CARLA</span> 执行与 <span class="latin">3DGS</span> 回投影。页面包含白车轨迹编辑和前车急刹两组视频日志回放。</p>
        <p class="project-meta">数据来源：<span class="latin">Waymo Open Dataset</span> 真实街景序列</p>
        <a href="projects/omnire-carla-gs/">查看项目主页 <span aria-hidden="true">→</span></a>
      </article>
    </div>
  </section>
</main>
</body>
</html>
